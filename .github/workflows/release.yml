name: Arcadible Release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      ARCWF_JSON: ${{ github.workspace }}/arcadible.json
    outputs:
      version: ${{ steps.define.outputs.version }}
      prerelease: ${{ steps.define.outputs.prerelease }}
      build: ${{ steps.define.outputs.build }}
      deploy_dir: ${{ steps.define.outputs.deploy_dir }}
      cache: ${{ steps.define.outputs.cache }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: |
          npm install -g @arcadible/github-release-tools@^1.0.0 --silent
          npm install -g arcadible@^1.0.0 --silent
      - name: Validate
        run: arc validate -C "$GITHUB_WORKSPACE" --quiet
      - name: Inspect
        run: arc inspect -C "$GITHUB_WORKSPACE" > "$ARCWF_JSON" --json
      - name: Assert Tag
        run: arctool-assert-tag "$ARCWF_JSON" "$GITHUB_REF_NAME"
      - name: Define
        id: define
        run: |
          arctool-put-version "$ARCWF_JSON"
          arctool-put-prerelease "$ARCWF_JSON"
          arctool-put-build "$ARCWF_JSON"
          arctool-put-deploy-dir "$ARCWF_JSON"
          arctool-put-cache "$ARCWF_JSON"
  build:
    needs: [setup]
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup Corepack
        if: needs.setup.outputs.cache == 'pnpm' || needs.setup.outputs.cache == 'yarn'
        run: corepack enable
      - name: Setup Node (cached)
        if: needs.setup.outputs.cache != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ needs.setup.outputs.cache }}
      - name: Install
        run: |
          npm install -g @arcadible/github-release-tools@^1.0.0 --silent
          npm install -g arcadible@^1.0.0 --silent
      - name: Install Dependencies
        if: needs.setup.outputs.build != '' && needs.setup.outputs.cache != ''
        run: arctool-install-deps "$GITHUB_WORKSPACE"
      - name: Build
        if: needs.setup.outputs.build != ''
        run: arc build -C "$GITHUB_WORKSPACE" --quiet
      - name: Assert Dir
        env:
          ARCWF_PUBLIC: ${{ github.workspace }}/${{ needs.setup.outputs.deploy_dir }}
        run: arctool-assert-dir "$ARCWF_PUBLIC"
      - name: Pack
        id: pack
        env:
          ARCWF_ZIP: ${{ github.workspace }}/${{ github.event.repository.name }}-v${{ needs.setup.outputs.version }}.zip
        run: |
          arc pack -C "$GITHUB_WORKSPACE" --output "$ARCWF_ZIP" --quiet
          arctool-put-artifact "$ARCWF_ZIP"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ${{ steps.pack.outputs.artifact }}
  publish:
    needs: [setup, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ARCWF_DIST: ${{ github.workspace }}/.arcadible-dist
    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ${{ env.ARCWF_DIST }}
      - name: Release
        id: release
        uses: arcadible/release-action@v3
        with:
          name: ${{ github.event.repository.name }} v${{ needs.setup.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.setup.outputs.prerelease }}
          draft: true
          files: ${{ env.ARCWF_DIST }}/*
      - name: Publish
        env:
          ARCWF_RELEASE: ${{ steps.release.outputs.id }}
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$ARCWF_RELEASE" -F draft=false --silent
